<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karavan OS — Enterprise B2B Distribution Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root{
  --ink:#0E1B1A;
  --ink-2:#152624;
  --ink-3:#1E332F;
  --paper:#F5F4EF;
  --paper-2:#ECEAE2;
  --card:#FFFFFF;
  --line:#DEDBD0;
  --text:#12201D;
  --muted:#5C6863;
  --orange:#FF6A1A;
  --orange-dark:#E05C10;
  --teal:#0F7C68;
  --teal-light:#E4F3EE;
  --amber:#E8A93A;
  --amber-light:#FBF0DC;
  --red:#C6432F;
  --red-light:#FBE9E5;
  --radius:10px;
  --mono:'IBM Plex Mono', monospace;
  --display:'Space Grotesk', sans-serif;
  --body:'IBM Plex Sans', sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--body);
  background:var(--paper);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.display{font-family:var(--display);}
.mono{font-family:var(--mono);}
a{color:inherit;}
button{font-family:var(--body);cursor:pointer;}
::selection{background:var(--orange);color:#fff;}

/* ---------- Shell ---------- */
#shell{min-height:100vh;display:flex;flex-direction:column;}

.topbar{
  background:var(--ink);
  color:#EFEEE7;
  display:flex;
  align-items:center;
  padding:0 20px;
  height:56px;
  flex-shrink:0;
  border-bottom:1px solid rgba(255,255,255,.08);
  position:sticky;top:0;z-index:100;
}
.brand{display:flex;align-items:center;gap:10px;margin-right:28px;flex-shrink:0;}
.brand-mark{
  width:28px;height:28px;border-radius:6px;
  background:linear-gradient(135deg,var(--orange),var(--orange-dark));
  display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-weight:700;font-size:14px;color:#0E1B1A;
}
.brand-name{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.2px;}
.brand-sub{font-size:10px;color:#9AA6A0;letter-spacing:1.5px;text-transform:uppercase;margin-top:-2px;}

.portal-tabs{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none;height:100%;}
.portal-tabs::-webkit-scrollbar{display:none;}
.ptab{
  background:none;border:none;color:#AEB8B3;
  font-size:13px;font-weight:500;padding:0 14px;height:100%;
  border-bottom:2px solid transparent;white-space:nowrap;
  display:flex;align-items:center;gap:6px;transition:.15s;
}
.ptab:hover{color:#fff;}
.ptab.active{color:#fff;border-bottom-color:var(--orange);}
.ptab .dot{width:5px;height:5px;border-radius:50%;background:var(--teal);}

.topbar-right{display:flex;align-items:center;gap:14px;flex-shrink:0;margin-left:12px;}
.pill{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);
  border-radius:20px;padding:5px 12px;font-size:12px;color:#DEE3E0;
  display:flex;align-items:center;gap:6px;
}
.avatar{
  width:30px;height:30px;border-radius:50%;background:var(--teal);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;
  flex-shrink:0;
}

main{flex:1;}
.view{display:none;}
.view.active{display:block;}

/* ---------- Utility ---------- */
.wrap{max-width:1280px;margin:0 auto;padding:0 24px;}
.grid{display:grid;gap:16px;}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;
}
.card-title{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600;margin:0 0 4px;}
.kpi-value{font-family:var(--display);font-size:28px;font-weight:600;margin:2px 0;}
.kpi-delta{font-size:12px;font-weight:600;}
.kpi-delta.up{color:var(--teal);}
.kpi-delta.down{color:var(--red);}
.section-title{font-family:var(--display);font-size:22px;font-weight:600;margin:0 0 4px;}
.section-sub{color:var(--muted);font-size:14px;margin:0 0 20px;}
.badge{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
  padding:3px 9px;border-radius:5px;letter-spacing:.3px;
}
.badge.green{background:var(--teal-light);color:var(--teal);}
.badge.amber{background:var(--amber-light);color:#92660F;}
.badge.red{background:var(--red-light);color:var(--red);}
.badge.grey{background:#EDEBE3;color:var(--muted);}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);
   padding:8px 10px;border-bottom:1px solid var(--line);font-weight:600;}
td{padding:11px 10px;border-bottom:1px solid var(--line);}
tr:last-child td{border-bottom:none;}
.btn{
  border:none;border-radius:7px;padding:10px 18px;font-size:13.5px;font-weight:600;
  display:inline-flex;align-items:center;gap:7px;transition:.15s;
}
.btn-primary{background:var(--orange);color:#fff;}
.btn-primary:hover{background:var(--orange-dark);}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--text);}
.btn-ghost:hover{background:var(--paper-2);}
.btn-dark{background:var(--ink);color:#fff;}
.btn-dark:hover{background:var(--ink-2);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-sm{padding:6px 12px;font-size:12.5px;}

/* ---------- Marketing ---------- */
.hero{
  background:var(--ink);color:#F4F3EC;padding:76px 0 60px;position:relative;overflow:hidden;
}
.hero::before{
  content:"";position:absolute;inset:0;
  background-image:radial-gradient(circle at 85% 20%, rgba(255,106,26,.14), transparent 45%),
                    radial-gradient(circle at 10% 90%, rgba(15,124,104,.18), transparent 40%);
}
.hero-inner{position:relative;z-index:1;}
.eyebrow{
  font-size:11.5px;letter-spacing:2px;text-transform:uppercase;color:var(--orange);
  font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:18px;
}
.hero h1{font-size:50px;line-height:1.05;font-weight:600;max-width:820px;margin:0 0 20px;letter-spacing:-.5px;}
.hero h1 em{font-style:normal;color:var(--orange);}
.hero p.lead{font-size:17px;color:#C4CBC7;max-width:560px;line-height:1.6;margin:0 0 30px;}
.hero-ctas{display:flex;gap:12px;margin-bottom:56px;}

/* signature pulse line */
.pulse-rail{
  border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:26px 30px 22px;
  background:rgba(255,255,255,.03);backdrop-filter:blur(2px);
}
.pulse-track{position:relative;height:6px;background:rgba(255,255,255,.08);border-radius:4px;margin:34px 0 14px;}
.pulse-fill{position:absolute;left:0;top:0;height:100%;background:linear-gradient(90deg,var(--teal),var(--orange));border-radius:4px;width:0%;transition:width 1.4s cubic-bezier(.4,0,.2,1);}
.pulse-node{
  position:absolute;top:50%;transform:translate(-50%,-50%);
  width:15px;height:15px;border-radius:50%;background:var(--ink);border:2px solid rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;
}
.pulse-node.lit{border-color:var(--orange);box-shadow:0 0 0 5px rgba(255,106,26,.18);}
.pulse-node.lit::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--orange);}
.pulse-labels{display:flex;justify-content:space-between;font-size:11.5px;color:#9AA6A0;margin-top:2px;}
.pulse-labels b{color:#F4F3EC;font-weight:600;}
.pulse-stats{display:flex;gap:0;margin-top:26px;border-top:1px solid rgba(255,255,255,.1);padding-top:20px;}
.pulse-stat{flex:1;border-right:1px solid rgba(255,255,255,.08);}
.pulse-stat:last-child{border-right:none;}
.pulse-stat .num{font-family:var(--display);font-size:24px;font-weight:600;color:#fff;}
.pulse-stat .lbl{font-size:11.5px;color:#9AA6A0;margin-top:2px;}

.eco-section{padding:60px 0;}
.eco-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:26px;}
.eco-card{border:1px solid var(--line);border-radius:10px;padding:18px;background:var(--card);}
.eco-card .ic{
  width:34px;height:34px;border-radius:8px;background:var(--paper-2);display:flex;align-items:center;justify-content:center;
  font-size:16px;margin-bottom:12px;
}
.eco-card h4{font-size:14.5px;margin:0 0 4px;}
.eco-card p{font-size:12.5px;color:var(--muted);margin:0;line-height:1.5;}

.qb-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:24px;}
.qb-card{border:1px solid var(--line);border-radius:10px;padding:20px;background:var(--card);}
.qb-card .q{font-size:12px;color:var(--orange);font-weight:600;margin-bottom:6px;}
.qb-card h4{font-size:15px;margin:0 0 6px;}
.qb-card p{font-size:13px;color:var(--muted);margin:0;line-height:1.55;}

footer.site{background:var(--ink);color:#9AA6A0;padding:30px 0;font-size:12.5px;text-align:center;}

/* ---------- Dashboards generic layout ---------- */
.dash-header{padding:28px 0 22px;border-bottom:1px solid var(--line);}
.dash-body{padding:24px 0 60px;}
.kpi-row{grid-template-columns:repeat(4,1fr);margin-bottom:20px;}
.two-col{grid-template-columns:2fr 1fr;align-items:start;}
.three-col{grid-template-columns:repeat(3,1fr);}
.flex-between{display:flex;justify-content:space-between;align-items:center;}
.list-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
.list-row:last-child{border-bottom:none;}

/* ---------- Wizard ---------- */
.wizard-shell{display:grid;grid-template-columns:220px 1fr 260px;gap:0;min-height:calc(100vh - 56px);}
.wizard-rail{background:var(--ink);color:#DEE3E0;padding:26px 18px;}
.wizard-rail h4{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:#8B968F;margin:0 0 16px;font-weight:600;}
.wstep{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:7px;font-size:13px;margin-bottom:2px;color:#9AA6A0;}
.wstep .num{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:10.5px;flex-shrink:0;font-family:var(--mono);}
.wstep.done{color:#DEE3E0;}
.wstep.done .num{background:var(--teal);color:#fff;}
.wstep.current{background:rgba(255,106,26,.12);color:#fff;font-weight:600;}
.wstep.current .num{background:var(--orange);color:#fff;}

.wizard-main{padding:30px 40px;background:var(--paper);}
.wizard-side{background:var(--card);border-left:1px solid var(--line);padding:26px 20px;}
.step-eyebrow{font-size:11px;color:var(--orange);text-transform:uppercase;letter-spacing:1.2px;font-weight:600;margin-bottom:6px;}
.step-title{font-family:var(--display);font-size:24px;font-weight:600;margin:0 0 6px;}
.step-hint{color:var(--muted);font-size:13.5px;margin:0 0 26px;max-width:560px;}

.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.choice-card{
  border:1.5px solid var(--line);border-radius:9px;padding:16px;background:var(--card);
  transition:.12s;text-align:left;
}
.choice-card:hover{border-color:#C7C2B3;}
.choice-card.selected{border-color:var(--orange);background:#FFF6F0;}
.choice-card .ic{font-size:20px;margin-bottom:8px;}
.choice-card h5{margin:0 0 3px;font-size:14px;}
.choice-card p{margin:0;font-size:12px;color:var(--muted);}

.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px;color:var(--text);}
.field select,.field input{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:7px;font-size:13.5px;
  background:var(--card);font-family:var(--body);
}

.product-search{position:relative;margin-bottom:18px;}
.product-search input{width:100%;padding:12px 14px 12px 38px;border:1.5px solid var(--line);border-radius:8px;font-size:14px;}
.product-search .si{position:absolute;left:13px;top:12px;color:var(--muted);}
.product-list{display:flex;flex-direction:column;gap:8px;}
.prow{
  display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);
}
.prow:hover{border-color:#C7C2B3;}
.prow .pic{width:40px;height:40px;border-radius:7px;background:var(--paper-2);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.prow .pinfo{flex:1;min-width:0;}
.prow .pinfo h5{margin:0 0 2px;font-size:13.5px;}
.prow .pinfo .meta{font-size:11.5px;color:var(--muted);font-family:var(--mono);}
.prow .stock-tag{font-size:11px;font-weight:600;}

.attr-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;margin-bottom:18px;}
.uom-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.uom-btn{
  flex:1;border:1.5px solid var(--line);border-radius:8px;padding:14px;text-align:center;background:var(--card);
}
.uom-btn.selected{border-color:var(--teal);background:var(--teal-light);}
.uom-btn .qty{font-family:var(--mono);font-size:18px;font-weight:600;}
.uom-btn .unit{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.conv-arrow{color:var(--muted);font-size:14px;}

.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:fit-content;}
.stepper button{background:var(--paper-2);border:none;width:38px;height:38px;font-size:16px;font-weight:600;}
.stepper input{width:64px;text-align:center;border:none;border-left:1px solid var(--line);border-right:1px solid var(--line);height:38px;font-family:var(--mono);font-size:15px;}

.inv-meter{display:flex;gap:2px;margin:14px 0;}
.inv-meter .seg{flex:1;height:8px;border-radius:2px;background:var(--paper-2);}
.inv-meter .seg.on{background:var(--teal);}
.inv-meter .seg.warn{background:var(--amber);}

.validation-box{
  border:1.5px solid var(--amber);background:var(--amber-light);border-radius:9px;padding:16px 18px;margin-top:16px;
}
.validation-box.ok{border-color:var(--teal);background:var(--teal-light);}
.validation-box h5{margin:0 0 6px;font-size:13.5px;display:flex;align-items:center;gap:7px;}
.validation-box p{margin:0 0 12px;font-size:13px;color:#5B4A17;line-height:1.5;}
.validation-box.ok p{color:#0B4A3D;}
.vopt{display:flex;flex-wrap:wrap;gap:8px;}
.vopt button{
  background:#fff;border:1px solid #D9C288;border-radius:6px;padding:7px 12px;font-size:12.5px;font-weight:600;
}
.vopt button.chosen{background:var(--ink);color:#fff;border-color:var(--ink);}

.price-table{border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-top:6px;}
.price-row{display:flex;justify-content:space-between;padding:11px 16px;font-size:13.5px;border-bottom:1px solid var(--line);background:var(--card);}
.price-row:last-child{border-bottom:none;}
.price-row.total{background:var(--ink);color:#fff;font-weight:600;font-size:15px;}
.price-row .neg{color:var(--teal);}

.cart-mini{background:var(--paper-2);border-radius:9px;padding:16px;}
.cart-mini h4{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:0 0 12px;}
.cart-item{display:flex;justify-content:space-between;font-size:12.5px;padding:8px 0;border-bottom:1px dashed #D2CEC1;}
.cart-item:last-child{border:none;}
.cart-item .nm{font-weight:600;}
.cart-item .sub{color:var(--muted);font-size:11px;}
.wizard-nav{display:flex;justify-content:space-between;margin-top:30px;padding-top:22px;border-top:1px solid var(--line);}

.review-block{border:1px solid var(--line);border-radius:9px;padding:18px 20px;margin-bottom:14px;background:var(--card);}
.review-block h5{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:0 0 12px;}
.sig-pad{
  border:2px dashed var(--line);border-radius:8px;height:110px;display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:13px;font-style:italic;background:var(--paper-2);
}
.sig-pad.signed{border-color:var(--teal);color:var(--teal);font-family:'Segoe Script','Brush Script MT',cursive;font-size:26px;font-style:normal;background:#fff;}
.upload-row{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:7px;padding:10px 14px;font-size:13px;background:var(--card);margin-top:8px;}

.confirm-hero{text-align:center;padding:40px 0 20px;}
.confirm-check{width:64px;height:64px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 18px;}
.order-num{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:1px;background:var(--paper-2);display:inline-block;padding:8px 18px;border-radius:8px;margin:10px 0 4px;}

/* warehouse map */
.wh-map{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.wh-zone{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--card);cursor:default;}
.wh-zone .zn{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.wh-zone .bins{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;}
.wh-zone .bin{height:16px;border-radius:2px;background:var(--paper-2);}
.wh-zone .bin.full{background:var(--teal);}
.wh-zone .bin.low{background:var(--amber);}
.wh-zone .bin.empty{background:var(--red-light);border:1px solid var(--red);}

.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.kcol{background:var(--paper-2);border-radius:9px;padding:12px;}
.kcol h5{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 10px;display:flex;justify-content:space-between;}
.kcard{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:10px 12px;margin-bottom:8px;font-size:12.5px;}
.kcard .id{font-family:var(--mono);color:var(--muted);font-size:11px;}
.kcard .nm{font-weight:600;margin:2px 0;}

/* chart containers */
.chart-box{position:relative;height:220px;}
.chart-box.tall{height:280px;}

/* responsive */
@media (max-width:980px){
  .wizard-shell{grid-template-columns:1fr;}
  .wizard-rail,.wizard-side{display:none;}
  .kpi-row,.two-col,.three-col,.eco-grid,.qb-grid,.choice-grid,.attr-grid{grid-template-columns:1fr 1fr;}
  .hero h1{font-size:34px;}
}
@media (max-width:640px){
  .kpi-row,.two-col,.three-col,.eco-grid,.qb-grid,.choice-grid,.attr-grid{grid-template-columns:1fr;}
  .wh-map{grid-template-columns:repeat(2,1fr);}
  .hero{padding:50px 0 40px;}
}
</style>
</head>
<body>
<div id="shell">

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">K</div>
      <div>
        <div class="brand-name">Karavan OS</div>
        <div class="brand-sub">Distribution Platform</div>
      </div>
    </div>
    <div class="portal-tabs" id="portalTabs"></div>
    <div class="topbar-right">
      <div class="pill"><span class="dot" style="width:6px;height:6px;border-radius:50%;background:#3EBF9A;display:inline-block;"></span> Live sync</div>
      <div class="avatar">KR</div>
    </div>
  </div>

  <main id="main"></main>

  <footer class="site" id="siteFooter" style="display:none;">
    Karavan OS — Enterprise B2B Commerce &amp; Distribution Platform · Prototype build · Not for production data
  </footer>

</div>

<script src="app.js"></script>
</body>
</html>
